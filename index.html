<!DOCTYPE html>
<html manifest="Cache.manifest" lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>القبطان ستور | البلايستيشن</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            background: #0f111a; 
            color: #fff; 
            padding: 40px 20px; 
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1a1d2e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        img { 
            width: 130px; 
            height: 130px; 
            border-radius: 50%; 
            border: 4px solid #00d2ff; 
            object-fit: cover;
            margin-bottom: 20px; 
        }
        h1 { margin: 10px 0; color: #00d2ff; }
        p { color: #aaa; margin-bottom: 20px; }
        #status { 
            background: #25293c; 
            padding: 12px; 
            border-radius: 6px; 
            color: #00d2ff; 
            font-weight: bold; 
            margin-bottom: 25px; 
        }
        .btn { 
            display: inline-block; 
            padding: 14px 28px; 
            background: linear-gradient(135deg, #007bff, #00d2ff); 
            color: #fff; 
            text-decoration: none; 
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 16px;
            box-shadow: 0 4px 10px rgba(0,123,255,0.4);
            transition: 0.3s;
        }
        .btn:hover { 
            opacity: 0.9; 
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- الشعار -->
        <img src="logo.png" alt="شعار القبطان ستور">
        
        <h1>القبطان ستور</h1>
        <p>مرحباً بك في البوابة الخاصة بصيانة وألعاب البلايستيشن</p>
        
        <!-- حالة التخزين -->
        <div id="status">جاري فحص التخزين الأوفلاين...</div>
        
        <!-- زر التشغيل -->
        <a href="#" class="btn">تشغيل GoldHEN</a>
    </div>

    <!-- سكربت التحكم في التخزين الأوفلاين -->
    <script>
        const statusDiv = document.getElementById('status');
        
        if (window.applicationCache) {
            window.applicationCache.addEventListener('checking', function() {
                statusDiv.innerHTML = 'جاري الفحص عن تحديثات...';
            });
            window.applicationCache.addEventListener('downloading', function() {
                statusDiv.innerHTML = 'جاري حفظ الموقع للأوفلاين... برجاء الانتظار';
            });
            window.applicationCache.addEventListener('cached', function() {
                statusDiv.innerHTML = '✅ تم حفظ الموقع بنجاح! يمكنك استخدامه بدون إنترنت الآن.';
                alert('تم حفظ الموقع بنجاح! يمكنك الآن فصل الإنترنت واستخدامه أوفلاين.');
            });
            window.applicationCache.addEventListener('noupdate', function() {
                statusDiv.innerHTML = '✅ الموقع محفوظ مسبقاً وجاهز للاستخدام أوفلاين.';
            });
            window.applicationCache.addEventListener('error', function() {
                statusDiv.innerHTML = 'جاهز للاستخدام.';
            });
        }
    </script>
</body>
</html>
