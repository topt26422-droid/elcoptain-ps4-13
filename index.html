<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="Cache.manifest">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>القبطان ستور | PS4 Jailbreak</title>
    <style>
      html, body { margin:0; padding:0; background:#0b0d10; color:#c8ced8; font:15px/1.45 "Segoe UI", system-ui, sans-serif; }
      #wrap { padding:16px 18px; text-align:center; }
      #state { font-size:22px; font-weight:700; margin:0 0 6px; }
      #det { font-size:13px; color:#8b95a3; margin:0 0 4px; }
      #det b { color:#c8ced8; font-weight:600; }
      #cache { font-size:12px; color:#5c6672; margin:0 0 10px; min-height:14px; }
      #cache.cacheok { color:#7fd0a0; }
      .ok { color:#7fd0a0; } .bad { color:#d08a7f; } .warn { color:#d8c07f; }
      #brand { text-align:center; padding:12px 10px; background:#0e1116; border-bottom:1px solid #1e2732; }
      #brand img { width:32px; height:32px; margin-left:8px; border-radius:50%; vertical-align:middle; object-fit:cover; }
      #brand b { font-size:17px; font-weight:700; letter-spacing:.05em; color:#00d2ff; vertical-align:middle; }
    </style>
</head>
<body>
    <div id="brand">
        <img src="logo.png" alt="القبطان ستور">
        <b>القبطان ستور</b>
    </div>
    <div id="wrap">
      <div id="state">جاري فحص الإصدار...</div>
      <div id="det"></div>
      <div id="cache"></div>
    </div>
    <script>
    (function () {
        var stateEl = document.getElementById("state");
        var detEl = document.getElementById("det");
        var cacheEl = document.getElementById("cache");
        function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
        function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
        var params = new URLSearchParams(location.search);
        var key = null, fwnum = null;
        var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
        if (m) {
            var minor = parseInt(m[2], 16);
            var ms = minor.toString(16);
            if (ms.length < 2) ms = "0" + ms;
            key = m[1] + "." + ms;
            fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
        }
        var bug = null, why = "";
        var forced = params.get("bug");
        if (forced === "lapse" || forced === "poops") {
            bug = forced; why = "تشغيل إجباري عبر ?bug=" + forced;
        } else if (!key) {
            why = "المتصفح ليس جهاز PlayStation 4";
        } else if (fwnum <= 1202) {
            bug = "lapse"; why = key + " <= 12.02";
        } else if (fwnum >= 1250) {
            bug = "poops"; why = key + " >= 12.50";
        } else {
            why = key + " -- لا توجد ثغرة متاحة حالياً لهذا الإصدار";
        }
        detEl.innerHTML = "التحديث: <b>" + (key || "غير معروف") + "</b>"
            + " &middot; الثغرة: <b>" + (bug || "لا يوجد") + "</b> &middot; " + why;

        if (!bug) { setState("إصدار غير مدعوم", "bad"); return; }

        var target = (bug === "lapse" ? "run_lapse.html" : "run_poops.html") + location.search;
        function go() { setState("جاري تحميل ثغرة " + bug + "...", "warn"); location.replace(target); }

        function waitForTap(msg, action) {
            setState(msg, "warn");
            function fire() {
                window.removeEventListener("click", fire);
                window.removeEventListener("keydown", fire);
                action();
            }
            window.addEventListener("click", fire);
            window.addEventListener("keydown", fire);
        }

        var ac = window.applicationCache;
        if (!ac || !document.documentElement.hasAttribute("manifest")) {
            go();
        } else if (!navigator.onLine) {
            setCache("أوفلاين -- يتم التشغيل من الذاكرة", true);
            go();
        } else if (ac.status === ac.IDLE) {
            setCache("محفوظ أوفلاين", true);
            go();
        } else if (ac.status === ac.UPDATEREADY) {
            try { ac.swapCache(); } catch (e) {}
            setCache("تم تنزيل التحديث", true);
            waitForTap("التحديث جاهز -- اضغط X للبدء", function () { location.reload(); });
        } else {
            setCache("جاري فحص التخزين...");
            ac.addEventListener("downloading", function () { setCache("جاري الحفظ للأوفلاين (أول مرة)..."); }, false);
            ac.addEventListener("progress", function (e) {
                if (e && e.total) setCache("جاري الحفظ " + Math.round((e.loaded / e.total) * 100) + "%");
            }, false);

            ac.addEventListener("cached", function () {
                setCache("تم الحفظ بنجاح للاستخدام أوفلاين", true);
                waitForTap("تم التخزين بنجاح -- اضغط X للبدء", go);
            }, false);
            ac.addEventListener("updateready", function () {
                try { ac.swapCache(); } catch (e) {}
                setCache("تم تنزيل التحديث", true);
                waitForTap("التحديث جاهز -- اضغط X للبدء", function () { location.reload(); });
            }, false);

            ac.addEventListener("noupdate", function () {
                setCache("جاهز للاستخدام أوفلاين", true);
                go();
            }, false);
            ac.addEventListener("error", function () {
                setCache("فشل التخزين الأوفلاين");
                waitForTap("اضغط X للتشغيل على أي حال", go);
            }, false);
            ac.addEventListener("obsolete", function () {
                setCache("التخزين قديم");
                waitForTap("اضغط X للتشغيل", go);
            }, false);
        }
    })();
    </script>
</body>
</html>
