<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>القبطان ستور | البلايستيشن</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            background: #0f111a; 
            color: #fff; 
            padding: 40px 20px; 
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1a1d2e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        img { 
            width: 130px; 
            height: 130px; 
            border-radius: 50%; 
            border: 4px solid #00d2ff; 
            object-fit: cover;
            margin-bottom: 20px; 
        }
        h1 { margin: 10px 0; color: #00d2ff; }
        p { color: #aaa; margin-bottom: 30px; }
        .btn { 
            display: inline-block; 
            padding: 14px 28px; 
            background: linear-gradient(135deg, #007bff, #00d2ff); 
            color: #fff; 
            text-decoration: none; 
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 16px;
            box-shadow: 0 4px 10px rgba(0,123,255,0.4);
            transition: 0.3s;
        }
        .btn:hover { 
            opacity: 0.9; 
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- مكان الصورة الشخصية أو الشعار -->
        <img src="logo.png" alt="شعار القبطان ستور">
        
        <h1>القبطان ستور</h1>
        <p>مرحباً بك في البوابة الخاصة بصيانة وألعاب البلايستيشن</p>
        
        <!-- زر التشغيل أو الأداة -->
        <a href="#" class="btn">تشغيل الأداة / البايلود</a>
    </div>
</body>
</html>
